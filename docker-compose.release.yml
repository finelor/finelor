services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.release
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/.finelor/db/finelor.db
      UPLOAD_STORAGE_PATH: /app/.finelor/uploads
      EXPORT_OUTPUT_PATH: /app/.finelor/exports
      WEB_ALLOWED_HOSTS: localhost,127.0.0.1,::1,0.0.0.0
      WEB_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "3000:3000"
    volumes:
      - ./migrations:/app/migrations:ro
      - ./assets:/app/assets:ro
      - ./config.yaml:/app/config.yaml:ro
      - finelor_runtime:/app/.finelor
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  finelor_runtime:
