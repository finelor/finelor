services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/.finelor/db/finelor.db
      UPLOAD_STORAGE_PATH: /app/.finelor/uploads
      EXPORT_OUTPUT_PATH: /app/.finelor/exports
      WEB_ALLOWED_HOSTS: localhost,127.0.0.1,::1,0.0.0.0
      WEB_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      RUST_BACKTRACE: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./migrations:/app/migrations:ro
      - ./assets:/app/assets:ro
      - ./config.yaml:/app/config.yaml:ro
      - finelor_runtime:/app/.finelor

volumes:
  finelor_runtime:
