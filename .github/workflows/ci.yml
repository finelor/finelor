name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          make bootstrap-local

      - name: Baseline Checks (make check)
        run: make check

      - name: App Build (make build-release)
        run: make build-release

      - name: Docs Check
        run: make docs-check

      - name: Prompt Assets Check
        run: make prompt-assets-check
