# Local override config for host/local development runs.
# Values here override matching keys from config.yaml when this file is present.

# DONT add any secrets here.

database:
  path: ".finelor/db/finelor.db"

web:
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

upload:
  storage_path: "./.finelor/uploads"

export:
  output_path: "./.finelor/exports"
